    <script>
    // Helper functions
    function statusBadge(status) {
        if (status === 'Pending') return `<span class="status-badge status-pending">Pending</span>`;
        if (status === 'Approved') return `<span class="status-badge status-approved">Approved</span>`;
        if (status === 'Rejected') return `<span class="status-badge status-rejected">Rejected</span>`;
        return `<span class="status-badge bg-gray-100 text-gray-800">${status}</span>`;
    }

    const modal = document.getElementById('supplyModal');
    const modalTitle = document.getElementById('modalTitle');
    const openModalBtn = document.getElementById('openModalBtn');
    const closeModalBtn = document.getElementById('closeModal');
    const modalVariantContainer = document.getElementById('modalVariantContainer');

    // Open modal for Add
    openModalBtn.onclick = () => {
        modalTitle.textContent = 'Add Supply';
        document.getElementById('supplyFormModal').reset();
        modalVariantContainer.innerHTML = '';
        document.getElementById('modal_supply_id').value = '';
        document.getElementById('modal_totalQuantity').readOnly = false;
        modal.classList.remove('hidden');
    };

    // Close modal
    closeModalBtn.onclick = () => modal.classList.add('hidden');
    modal.addEventListener('click', e => {
        if (e.target === modal) modal.classList.add('hidden');
    });

    // Add variant in modal
    document.getElementById('modalAddVariant').onclick = () => {
        const row = document.createElement('div');
        row.className = 'variantRow grid grid-cols-1 md:grid-cols-3 gap-2 items-center';
        row.innerHTML = `
        <input name="variant_name[]" type="text" placeholder="Variant Name" class="border px-3 py-1.5 rounded-lg text-sm focus:ring-2 focus:ring-[--accent]">
        <input name="variant_quantity[]" type="number" placeholder="Quantity" class="border px-3 py-1.5 rounded-lg text-sm focus:ring-2 focus:ring-[--accent]">
        <button type="button" class="removeVariant bg-red-600 hover:bg-red-700 text-white rounded-md px-3 py-1.5 text-xs">Remove</button>
      `;
        modalVariantContainer.appendChild(row);
        setTimeout(updateTotalQuantity, 100);
    };

    document.addEventListener('click', e => {
        if (e.target.classList.contains('removeVariant')) {
            e.target.closest('.variantRow').remove();
            setTimeout(updateTotalQuantity, 100);
        }
    });

    // Auto-update total quantity
    function updateTotalQuantity() {
        const qtyInputs = document.querySelectorAll('input[name="variant_quantity[]"]');
        let total = 0;
        qtyInputs.forEach(input => total += parseInt(input.value) || 0);
        const totalInput = document.getElementById('modal_totalQuantity');
        if (qtyInputs.length > 0) totalInput.value = total;
        totalInput.readOnly = false;
        totalInput.classList.remove('bg-gray-100');
        totalInput.classList.add('bg-white');
    }

    document.addEventListener('input', e => {
        if (e.target.name === 'variant_quantity[]') updateTotalQuantity();
    });

    // Load supplies + render
    let allSupplies = [];

    async function loadSupplies() {
        try {
            const res = await fetch('supplies/list.php');
            if (!res.ok) throw new Error('Failed to load supplies');
            const data = await res.json();
            allSupplies = data;
            renderSupplies();
        } catch (err) {
            const tbody = document.getElementById('supplyTableBody');
            tbody.innerHTML =
                `<tr><td colspan="7" class="p-6 text-center text-red-600">Error: ${err.message}</td></tr>`;
            document.getElementById('mobileCards').innerHTML =
                `<p class="text-red-600 text-center py-10">Error: ${err.message}</p>`;
        }
        lucide.createIcons();
    }

    function renderSupplies() {
        const tbody = document.getElementById('supplyTableBody');
        const mobileGrid = document.getElementById('mobileCards');
        tbody.innerHTML = '';
        mobileGrid.innerHTML = '';

        if (!Array.isArray(allSupplies) || allSupplies.length === 0) {
            const isMobile = window.innerWidth < 768;
            document.getElementById('supplyTableBody').innerHTML = '';
            document.getElementById('mobileCards').innerHTML = '';

            if (isMobile) {
                document.getElementById('noResultsCard').classList.remove('hidden');
                document.getElementById('noResultsRow').classList.add('hidden');
            } else {
                document.getElementById('noResultsRow').classList.remove('hidden');
                document.getElementById('noResultsCard').classList.add('hidden');
            }
            return;
        } else {
            document.getElementById('noResultsRow').classList.add('hidden');
            document.getElementById('noResultsCard').classList.add('hidden');
        }


        allSupplies.forEach(s => {
            const tr = document.createElement('tr');

            // Image
            const tdImage = document.createElement('td');
            tdImage.className = 'p-2';
            if (s.image) {
                const img = document.createElement('img');
                img.src = s.image;
                img.alt = s.name;
                img.className = 'w-12 h-12 object-cover rounded mx-auto';
                tdImage.appendChild(img);
            } else tdImage.textContent = '-';
            tr.appendChild(tdImage);

            // Name, Description, Qty, Unit
            ['name', 'description', 'quantity_available', 'unit'].forEach((key, i) => {
                const td = document.createElement('td');
                td.className = 'p-2';
                td.textContent = s[key] || (i === 2 ? 0 : '-');
                tr.appendChild(td);
            });

            // Variants
            const tdVariants = document.createElement('td');
            tdVariants.className = 'p-2';
            if (s.variants?.length) {
                s.variants.forEach(v => {
                    const div = document.createElement('div');
                    div.className = 'text-xs';
                    div.textContent = `${v.variant_name}: ${v.quantity_available}`;
                    tdVariants.appendChild(div);
                });
            } else {
                const i = document.createElement('i');
                i.className = 'text-gray-400 text-xs';
                i.textContent = 'None';
                tdVariants.appendChild(i);
            }
            tr.appendChild(tdVariants);

            // Actions
            const tdActions = document.createElement('td');
            tdActions.className = 'p-2 flex gap-2 justify-center';
            const editBtn = document.createElement('button');
            editBtn.className = 'text-[--accent] text-xs';
            editBtn.textContent = 'Edit';
            editBtn.onclick = () => editSupply(s);
            const delBtn = document.createElement('button');
            delBtn.className = 'text-red-600 text-xs';
            delBtn.textContent = 'Delete';
            delBtn.onclick = () => deleteSupply(s.supply_id);
            tdActions.appendChild(editBtn);
            tdActions.appendChild(delBtn);
            tr.appendChild(tdActions);

            tbody.appendChild(tr);

            // Mobile card
            const card = document.createElement('div');
            card.className =
                'bg-white rounded-2xl shadow-sm border border-gray-100 p-4 flex flex-col gap-2 hover:shadow-lg transition w-full';
            const top = document.createElement('div');
            top.className = 'flex justify-between items-center mb-2';
            const nameSpan = document.createElement('span');
            nameSpan.className = 'text-sm text-gray-700 font-medium';
            nameSpan.textContent = s.name;
            top.appendChild(nameSpan);
            card.appendChild(top);

            const desc = document.createElement('p');
            desc.className = 'text-sm text-gray-800';
            desc.innerHTML =
                `<strong>Qty:</strong> ${s.quantity_available || 0} • <strong>Unit:</strong> ${s.unit || '-'} `;
            card.appendChild(desc);

            const variantsDiv = document.createElement('div');
            variantsDiv.className = 'text-sm text-gray-800';
            if (s.variants?.length) {
                s.variants.forEach(v => {
                    const vdiv = document.createElement('div');
                    vdiv.className = 'text-xs';
                    vdiv.textContent = `${v.variant_name}: ${v.quantity_available}`;
                    variantsDiv.appendChild(vdiv);
                });
            } else {
                variantsDiv.innerHTML = `<i class="text-gray-400 text-xs">None</i>`
            }
            card.appendChild(variantsDiv);

            const actionsRow = document.createElement('div');
            actionsRow.className = 'flex gap-3 justify-center mt-2';
            const ebtn = document.createElement('button');
            ebtn.className = 'text-[--accent] text-sm';
            ebtn.textContent = 'Edit';
            ebtn.onclick = () => editSupply(s);
            const dbtn = document.createElement('button');
            dbtn.className = 'text-red-600 text-sm';
            dbtn.textContent = 'Delete';
            dbtn.onclick = () => deleteSupply(s.supply_id);
            actionsRow.appendChild(ebtn);
            actionsRow.appendChild(dbtn);
            card.appendChild(actionsRow);

            mobileGrid.appendChild(card);
        });

        // apply search filter if input has value
        applySearchFilter();
    }

    // Edit supply
    function editSupply(supply) {
        modalTitle.textContent = 'Edit Supply';
        modal.classList.remove('hidden');
        const form = document.getElementById('supplyFormModal');
        form.reset();
        document.getElementById('modal_supply_id').value = supply.supply_id;
        form.querySelector('input[name="name"]').value = supply.name || '';
        form.querySelector('input[name="description"]').value = supply.description || '';
        document.getElementById('modal_totalQuantity').value = supply.quantity_available || 0;
        form.querySelector('input[name="unit"]').value = supply.unit || '';
        modalVariantContainer.innerHTML = '';
        if (supply.variants?.length) {
            supply.variants.forEach(v => {
                const row = document.createElement('div');
                row.className = 'variantRow grid grid-cols-1 md:grid-cols-3 gap-2 items-center';
                row.innerHTML = `
            <input name="variant_name[]" type="text" placeholder="Variant Name" class="border px-3 py-1.5 rounded-lg text-sm" value="${v.variant_name}">
            <input name="variant_quantity[]" type="number" placeholder="Quantity" class="border px-3 py-1.5 rounded-lg text-sm" value="${v.quantity_available}">
            <button type="button" class="removeVariant bg-red-600 hover:bg-red-700 text-white rounded-md px-3 py-1.5 text-xs">Remove</button>
          `;
                modalVariantContainer.appendChild(row);
            });
        }
    }

    // Delete supply
    async function deleteSupply(id) {
        if (!confirm('Delete this supply?')) return;
        try {
            const res = await fetch('supplies/delete.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: `supply_id=${id}`
            });
            const text = await res.text();
            showToast(text.includes('success') ? text : 'Deleted successfully', 'success');

            loadSupplies();
        } catch (err) {
            showToast('Delete failed: ' + err.message, 'error');

        }
    }

    // Submit modal form
    document.getElementById('supplyFormModal').addEventListener('submit', async e => {
        e.preventDefault();
        const formData = new FormData(e.target);

        // Prepare variants JSON
        const variants = [];
        const names = formData.getAll('variant_name[]');
        const quantities = formData.getAll('variant_quantity[]');
        for (let i = 0; i < names.length; i++) {
            if (names[i]) variants.push({
                variant_name: names[i],
                quantity_available: quantities[i] || 0
            })
        }
        formData.append('variants', JSON.stringify(variants));

        const supplyId = formData.get('supply_id');
        const url = supplyId ? 'supplies/edit.php' : 'supplies/add.php';

        try {
            const res = await fetch(url, {
                method: 'POST',
                body: formData
            });
            const data = await res.json();
            showToast(data.message || 'Saved successfully', data.status === 'success' ? 'success' :
            'error');

            if (data.status === 'success') {
                e.target.reset();
                modal.classList.add('hidden');
                loadSupplies();
            }
        } catch (err) {
            showToast('Save failed: ' + err.message, 'error');


        }
    });

    function applySearchFilter() {
        const filter = document.getElementById('searchInput').value.toLowerCase();
        const rows = document.querySelectorAll('#supplyTableBody tr');
        const cards = document.querySelectorAll('#mobileCards > div');

        let anyVisibleDesktop = false;
        let anyVisibleMobile = false;

        // ✅ Desktop (Table)
        rows.forEach(row => {
            const text = Array.from(row.children)
                .slice(1, 6)
                .map(td => td.textContent.toLowerCase())
                .join(' ');
            const visible = text.includes(filter);
            row.style.display = visible ? '' : 'none';
            if (visible) anyVisibleDesktop = true;
        });

        // ✅ Mobile (Cards)
        cards.forEach(card => {
            const txt = card.textContent.toLowerCase();
            const visible = txt.includes(filter);
            card.style.display = visible ? '' : 'none';
            if (visible) anyVisibleMobile = true;
        });

        // ✅ Show message only in visible layout
        const isMobile = window.innerWidth < 768; // Tailwind md breakpoint
        if (isMobile) {
            document.getElementById('noResultsCard').classList.toggle('hidden', anyVisibleMobile);
            document.getElementById('noResultsRow').classList.add('hidden');
        } else {
            document.getElementById('noResultsRow').classList.toggle('hidden', anyVisibleDesktop);
            document.getElementById('noResultsCard').classList.add('hidden');
        }
    }


    document.getElementById('searchInput').addEventListener('input', applySearchFilter);

    // ---- Auto-refresh (10s) with smooth fade ----
    setInterval(async () => {
        try {
            const res = await fetch('supplies/list.php');
            if (!res.ok) throw new Error('Failed to refresh supplies');
            const data = await res.json();
            const newData = JSON.stringify(data);
            const oldData = JSON.stringify(allSupplies);
            if (newData !== oldData) {
                allSupplies = data;
                fadeUpdate(() => renderSupplies());
            }
        } catch (err) {
            console.error('Auto-refresh failed:', err)
        }
    }, 10000);

    function fadeUpdate(updateFn) {
        const tbody = document.getElementById('supplyTableBody');
        const mobile = document.getElementById('mobileCards');
        tbody.style.opacity = '0';
        mobile.style.opacity = '0';
        setTimeout(() => {
            updateFn();
            tbody.style.opacity = '1';
            mobile.style.opacity = '1';
        }, 400);
    }

    // initial load
    loadSupplies();
    lucide.createIcons();


    // 🌟 Toast function
    function showToast(message, type = "success") {
        const container = document.getElementById("toastContainer");
        const toast = document.createElement("div");
        toast.className = `toast toast-${type}`;
        toast.innerHTML = `
    <i data-lucide="${type === "success" ? "check-circle" : type === "error" ? "x-circle" : "alert-circle"}"
      class="w-5 h-5"></i>
    <span>${message}</span>
  `;
        container.appendChild(toast);
        lucide.createIcons();

        // Auto-remove
        setTimeout(() => {
            toast.remove();
        }, 3500);
    }
    </script>
