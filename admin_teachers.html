<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Teachers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Parkinsans:wght@300..800&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent: #f97316;
            --muted: #6b7280;
        }

        body,
        input,
        select,
        button,
        textarea,
        label {
            font-family: 'Parkinsans', sans-serif;
        }

        body {
            background-color: #fafafa;
            color: #1f2937;
            letter-spacing: -0.01em;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        main {
            margin-top: 80px;
        }

        th,
        td {
            font-size: 13px;
            text-align: center;
        }

        @media (min-width: 1024px) {
            main {
                margin-left: 16rem;
            }
        }

        @media (max-width: 1023px) {
            main {
                margin-left: 0;
            }
        }

        /* Toast styles */
        .toast {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: white;
            font-size: 14px;
            padding: 10px 16px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
            animation: slideDown 0.4s ease, fadeOut 0.5s ease 2.8s forwards;
        }

        #toastContainer {
            top: 80px;
        }

        .toast-success {
            background: rgba(34, 197, 94, 0.25);
            border-left: 4px solid #22c55e;
        }

        .toast-error {
            background: rgba(239, 68, 68, 0.25);
            border-left: 4px solid #ef4444;
        }

        .toast-warning {
            background: rgba(234, 179, 8, 0.25);
            border-left: 4px solid #eab308;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: translateY(-20px) scale(0.95);
            }
        }
    </style>

    <style>
@keyframes pulse-slow {
    0%, 100% { opacity: 0.9; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.05); }
}
.animate-pulse-slow { animation: pulse-slow 3s ease-in-out infinite; }

@keyframes bounce-once {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
}
.bounce { animation: bounce-once 0.4s ease; }
</style>

</head>

<header class="fixed w-full z-50 bg-gradient-to-r from-orange-500 via-orange-600 to-orange-700 shadow-lg backdrop-blur-md transition-all duration-300">
  <div class="max-w-7xl mx-auto px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="bg-white/20 p-2 rounded-full shadow-inner animate-pulse-slow">
        <i data-lucide="settings" class="w-6 h-6 text-white"></i>
      </div>
      <h1 class="text-lg font-semibold text-white tracking-wide">Admin Panel</h1>
    </div>
    <nav id="navLinks" class="flex items-center gap-6 text-sm font-medium"></nav>
  </div>
</header>

<body class="relative min-h-screen text-gray-700" style="background: url('assets/logo/danhs1.jpg') no-repeat center center fixed; background-size: cover;">
<div class="absolute inset-0 bg-black/80 backdrop-blur-sm">
  <div class="flex">
        <main class="flex-1 p-4 sm:p-6 max-w-7xl mx-auto">
            <!-- Header -->
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-6 gap-4">
                <div class="flex items-center gap-2">
                    <i data-lucide="user" class="w-6 h-6" style="color:var(--accent)"></i>
                    <h2 class="text-xl font-semibold text-white">Teachers Management</h2>
                </div>
                <div class="flex items-center gap-3">
                    <div class="relative">
                        <i data-lucide="search" class="absolute left-3 top-2.5 w-4 h-4 text-gray-400"></i>
                        <input id="searchInput" type="text" placeholder="Search teachers..."
                            class="pl-9 pr-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-[--accent] w-56 sm:w-64 transition" />
                    </div>
                    <button id="openModalBtn"
                        class="bg-[--accent] hover:brightness-90 text-white text-sm font-medium px-4 py-2 rounded-lg flex items-center gap-2 transition">
                        <i data-lucide="plus-circle" class="w-4 h-4"></i> Add Teacher
                    </button>
                </div>
            </div>

            <!-- Table Section -->
            <section class="bg-white rounded-2xl shadow border border-gray-100 overflow-hidden">
                <div class="hidden md:block overflow-x-auto">
                    <table class="min-w-full text-sm">
                        <thead class="bg-[--accent] text-white">
                            <tr>
                                <th class="p-3">Name</th>
                                <th class="p-3">Department</th>
                                <th class="p-3">Email</th>
                                <th class="p-3">Contact</th>
                                <th class="p-3">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="teacherTableBody" class="divide-y divide-gray-100 text-center transition-opacity duration-500"></tbody>
                        <tr id="noResultsRow" class="hidden">
                            <td colspan="5" class="py-6 text-gray-400 italic">No results found.</td>
                        </tr>
                    </table>
                </div>
                <div id="mobileCards" class="md:hidden p-4 grid gap-4"></div>
                <p id="noResultsCard" class="hidden text-center py-8 text-gray-400 italic">No results found.</p>
            </section>
        </main>
    </div>

    <!-- Modal -->
    <div id="teacherModal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center">
        <div class="bg-white rounded-xl shadow-lg w-full max-w-2xl p-5 relative">
            <button id="closeModal" class="absolute top-3 right-3 text-gray-500 hover:text-gray-700">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>

            <h3 class="text-lg font-semibold mb-4 flex items-center gap-2">
                <i data-lucide="user-plus" class="w-5 h-5" style="color:var(--accent)"></i>
                <span id="modalTitle">Add Teacher</span>
            </h3>

            <form id="teacherForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="hidden" name="teacher_id" id="teacher_id" />

                <div class="flex flex-col">
                    <label class="text-xs font-semibold text-gray-600 mb-1">Full Name</label>
                    <input name="full_name" type="text" placeholder="Full Name" required
                        class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-[--accent] transition">
                </div>

                <div class="flex flex-col">
                    <label class="text-xs font-semibold text-gray-600 mb-1">Department</label>
                    <input name="department" type="text" placeholder="Department"
                        class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-[--accent] transition">
                </div>

                <div class="flex flex-col">
                    <label class="text-xs font-semibold text-gray-600 mb-1">Email</label>
                    <input name="email" type="email" placeholder="Email"
                        class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-[--accent] transition">
                </div>

                <div class="flex flex-col">
                    <label class="text-xs font-semibold text-gray-600 mb-1">Contact Number</label>
                    <input name="contact_number" type="text" placeholder="Contact Number"
                        class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-[--accent] transition">
                </div>

                <div class="flex flex-col">
                    <label class="text-xs font-semibold text-gray-600 mb-1">Username</label>
                    <input name="username" type="text" placeholder="Username" required
                        class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-[--accent] transition">
                </div>

                <div class="flex flex-col">
                    <label class="text-xs font-semibold text-gray-600 mb-1">Password</label>
                    <input name="password" type="password" placeholder="Password"
                        class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-[--accent] transition">
                </div>

                <div class="col-span-2 flex justify-end mt-5">
                    <button type="submit"
                        class="bg-[--accent] hover:brightness-90 text-white text-sm font-medium rounded-lg px-6 py-2.5 flex items-center gap-2 transition">
                        <i data-lucide="save" class="w-4 h-4"></i> Save Teacher
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer"
        class="fixed top-6 left-1/2 -translate-x-1/2 z-[9999] flex flex-col gap-3 items-center pointer-events-none">
    </div>

    <script>
        lucide.createIcons();


        // ---- NAV LINKS ----
const links = [
    { href: "admin_dashboard.html", label: "Supplies" },
    { href: "admin_teachers.html", label: "Teachers" },
    { href: "admin_requests.html", label: "Requests", badge: true },
    { href: "admin_transactions.html", label: "Transactions" }
];

const currentPage = window.location.pathname.split("/").pop();
const navContainer = document.getElementById('navLinks');

links.forEach(link => {
    const a = document.createElement('a');
    a.href = link.href;
    a.className = 'relative group flex items-center gap-1 text-orange-100 hover:text-white transition-colors duration-300';
    if(currentPage === link.href) a.classList.add('text-white', 'font-semibold');
    a.textContent = link.label;

    // Badge for requests
    if(link.badge) {
        const badge = document.createElement('span');
        badge.id = 'notifBadge';
        badge.className = 'hidden ml-1 bg-red-600 text-white text-xs font-bold rounded-full px-1.5 py-0.5 shadow-md';
        badge.textContent = '0';
        a.appendChild(badge);
    }

    const underline = document.createElement('span');
    underline.className = `absolute left-0 -bottom-1 w-full h-0.5 ${currentPage === link.href ? 'bg-white scale-x-100' : 'bg-white/60 scale-x-0 group-hover:scale-x-100'} transition-transform duration-300 origin-left`;
    a.appendChild(underline);

    navContainer.appendChild(a);
});

// Logout button
const logout = document.createElement('a');
logout.href = 'logout.html';
logout.className = 'ml-2 bg-white/20 hover:bg-red-500 text-white px-3 py-1.5 rounded-md transition-all duration-300 hover:shadow-lg hover:translate-y-[-2px]';
logout.textContent = 'Logout';
navContainer.appendChild(logout);

// ---- REQUEST BADGE FUNCTIONALITY ----
let lastCount = 0;

async function loadRequestCount() {
    try {
        const res = await fetch('requests/pending_count_admin.json'); // Replace with your API or JSON endpoint
        const data = await res.json();
        const badge = document.getElementById('notifBadge');
        const count = data.count || 0;

        if(count > 0) {
            badge.textContent = count;
            badge.classList.remove('hidden');
            if(count !== lastCount) {
                badge.classList.add('bounce');
                setTimeout(() => badge.classList.remove('bounce'), 500);
            }
        } else {
            badge.classList.add('hidden');
        }
        lastCount = count;
    } catch(err) {
        console.error('Failed to load request count:', err);
    }
}

// Load immediately and refresh every 15s
loadRequestCount();
setInterval(loadRequestCount, 15000);

        function showToast(message, type = "success") {
            const container = document.getElementById("toastContainer");
            const toast = document.createElement("div");
            toast.className = `toast toast-${type}`;

            const icon =
                type === "success" ?
                "check-circle" :
                type === "error" ?
                "x-circle" :
                "alert-triangle";

            toast.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5"></i><span>${message}</span>`;
            container.appendChild(toast);
            lucide.createIcons({ icons: [icon] });

            setTimeout(() => toast.remove(), 3500);
        }

        const modal = document.getElementById('teacherModal');
        const modalTitle = document.getElementById('modalTitle');
        const openModalBtn = document.getElementById('openModalBtn');
        const closeModalBtn = document.getElementById('closeModal');
        const teacherForm = document.getElementById('teacherForm');
        let teacherData = [];

        openModalBtn.onclick = () => {
            modalTitle.textContent = 'Add Teacher';
            teacherForm.reset();
            document.getElementById('teacher_id').value = '';
            modal.classList.remove('hidden');
        };

        closeModalBtn.onclick = () => modal.classList.add('hidden');
        modal.addEventListener('click', e => {
            if (e.target === modal) modal.classList.add('hidden');
        });

        // ---- Demo Data ----
        teacherData = [
            { teacher_id: '1', full_name: 'Zxian The Programmer', department: 'Math', email: 'zxian@gmail.com', contact_number: '09123456789', username: 'zxian.programmer' },
        ];

        function renderTeachers() {
            const tbody = document.getElementById('teacherTableBody');
            const mobileGrid = document.getElementById('mobileCards');
            const noResultsRow = document.getElementById('noResultsRow');
            const noResultsCard = document.getElementById('noResultsCard');

            tbody.innerHTML = '';
            mobileGrid.innerHTML = '';

            const isMobile = window.innerWidth < 768;

            if (!teacherData.length) {
                if (isMobile) { noResultsCard.classList.remove('hidden'); noResultsRow.classList.add('hidden'); }
                else { noResultsRow.classList.remove('hidden'); noResultsCard.classList.add('hidden'); }
                return;
            }

            noResultsRow.classList.add('hidden'); noResultsCard.classList.add('hidden');

            teacherData.forEach(t => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-3">${t.full_name || '-'}</td>
                    <td class="p-3">${t.department || '-'}</td>
                    <td class="p-3">${t.email || '-'}</td>
                    <td class="p-3">${t.contact_number || '-'}</td>
                    <td class="p-3 flex justify-center gap-2">
                        <button class="text-[--accent] text-xs" onclick='editTeacher("${t.teacher_id}")'>Edit</button>
                        <button class="text-red-600 text-xs" onclick='deleteTeacher("${t.teacher_id}")'>Delete</button>
                    </td>`;
                tbody.appendChild(tr);

                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl shadow-sm border border-gray-100 p-4 flex flex-col gap-2';
                card.innerHTML = `
                    <p class="text-sm font-medium text-gray-800">${t.full_name}</p>
                    <p class="text-sm text-gray-700">${t.department || '—'}</p>
                    <p class="text-xs text-gray-600">${t.email || ''}</p>
                    <p class="text-xs text-gray-600">${t.contact_number || ''}</p>
                    <div class="flex gap-3 justify-center mt-2">
                        <button class="text-[--accent] text-sm" onclick='editTeacher("${t.teacher_id}")'>Edit</button>
                        <button class="text-red-600 text-sm" onclick='deleteTeacher("${t.teacher_id}")'>Delete</button>
                    </div>`;
                mobileGrid.appendChild(card);
            });
        }

        function editTeacher(id) {
            const t = teacherData.find(x => x.teacher_id === id);
            if (!t) return;
            modalTitle.textContent = 'Edit Teacher';
            modal.classList.remove('hidden');
            document.getElementById('teacher_id').value = t.teacher_id;
            teacherForm.full_name.value = t.full_name;
            teacherForm.department.value = t.department;
            teacherForm.email.value = t.email;
            teacherForm.contact_number.value = t.contact_number;
            teacherForm.username.value = t.username;
        }

        function deleteTeacher(id) {
            if (!confirm('Delete this teacher?')) return;
            teacherData = teacherData.filter(x => x.teacher_id !== id);
            showToast('Teacher deleted successfully!', 'success');
            renderTeachers();
        }

        teacherForm.addEventListener('submit', e => {
            e.preventDefault();
            const formData = new FormData(teacherForm);
            const id = formData.get('teacher_id');
            const teacherObj = {
                teacher_id: id || Date.now().toString(),
                full_name: formData.get('full_name'),
                department: formData.get('department'),
                email: formData.get('email'),
                contact_number: formData.get('contact_number'),
                username: formData.get('username')
            };

            if (id) {
                const index = teacherData.findIndex(x => x.teacher_id === id);
                teacherData[index] = teacherObj;
                showToast('Teacher updated successfully!', 'success');
            } else {
                teacherData.push(teacherObj);
                showToast('Teacher added successfully!', 'success');
            }

            modal.classList.add('hidden');
            teacherForm.reset();
            renderTeachers();
        });

        document.getElementById('searchInput').addEventListener('input', e => {
            const filter = e.target.value.toLowerCase();
            const rows = document.querySelectorAll('#teacherTableBody tr');
            const cards = document.querySelectorAll('#mobileCards > div');
            let visibleCount = 0;
            const isMobile = window.innerWidth < 768;

            rows.forEach(tr => { const match = tr.textContent.toLowerCase().includes(filter); tr.style.display = match ? '' : 'none'; if (match) visibleCount++; });
            cards.forEach(card => { const match = card.textContent.toLowerCase().includes(filter); card.style.display = match ? '' : 'none'; if (match) visibleCount++; });

            document.getElementById('noResultsRow').classList.toggle('hidden', visibleCount !== 0);
            document.getElementById('noResultsCard').classList.toggle('hidden', visibleCount !== 0);
        });

        renderTeachers();
    </script>
</body>

</html>
