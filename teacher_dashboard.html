<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Teacher Dashboard - EduSupply Connect</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Parkinsans:wght@300..800&display=swap" rel="stylesheet">
<style>
body, h1,h2,h3,h4,h5,h6,input,select,button,p,label { font-family:'Parkinsans', sans-serif; }
body { background-color:#fafafa; color:#1f2937; letter-spacing:-0.01em; }
.cart-badge { position:absolute; top:-6px; right:-6px; background-color:#2a16adff; color:white; font-size:0.7rem; padding:1px 5px; border-radius:9999px; font-weight:bold;}
#cartPanel { transition:transform 0.3s ease-in-out; }
#cartOverlay { background-color: rgba(0,0,0,0.5); transition:opacity 0.3s ease-in-out;}
#toastContainer { position: fixed; top:1rem; left:70%; transform: translateX(-50%); display:flex; flex-direction:column; gap:0.5rem; z-index:50; pointer-events:none;}
@keyframes slide-down { 0% { transform: translate(-50%,-100%); opacity:0;} 100% { transform: translate(-50%,0); opacity:1; }}
.animate-slide-in { animation: slide-down 0.3s ease forwards; }
@media (max-width:768px) { #cartPanel { width:100%; bottom:0; top:auto; height:80vh; border-radius:1.5rem 1.5rem 0 0; }}
@keyframes bounce-once { 0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);} }
.bounce { animation: bounce-once 0.4s ease; }
.nav-active { background-color:#c05621; cursor:default; }
.nav-hover:hover { background-color:#c05621; transition:0.2s; }
</style>
</head>
<body class="bg-gray-50 min-h-screen flex">

<!-- Sidebar -->
<aside class="hidden md:flex w-56 bg-orange-600 text-white flex-col shadow-lg text-sm">
  <div class="p-4 text-lg font-semibold border-b border-orange-500 flex items-center gap-2">
    <i data-lucide="school" class="w-5 h-5"></i> Teacher Panel
  </div>
  <nav class="flex-1 mt-4 space-y-1 px-3">
    <a href="teacher_dashboard.html" id="link-dashboard" class="flex items-center gap-2 px-3 py-2 rounded font-medium">
      <i data-lucide="home" class="w-4 h-4"></i> Dashboard
    </a>
    <a href="teacher_requests.html" id="link-requests" class="flex items-center justify-between px-3 py-2 rounded font-medium">
      <div class="flex items-center gap-2">
        <i data-lucide="file-text" class="w-4 h-4"></i> My Requests
      </div>
      <span id="notifBadge" class="hidden bg-red-800 text-white text-xs font-semibold px-2 py-0.5 rounded-full shadow-md">0</span>
    </a>
    <a href="logout.html" class="flex items-center gap-2 px-3 py-2 rounded hover:bg-orange-700 transition font-medium">
      <i data-lucide="log-out" class="w-4 h-4"></i> Log Out
    </a>
  </nav>
  <div class="p-3 border-t border-orange-500 text-xs text-orange-100">
    Logged in as: <strong>Teacher</strong>
  </div>
</aside>

<!-- Main Content -->
<main class="flex-1 p-4 sm:p-6 overflow-x-auto">
  <div id="toastContainer"></div>
  <div class="flex justify-between items-center mb-5">
    <h2 class="text-xl font-semibold text-gray-800 flex items-center gap-2">
      <i data-lucide="shopping-bag" class="w-5 h-5 text-orange-600"></i> Available Supplies
    </h2>
    <button onclick="toggleCart()" class="relative bg-orange-500 text-white px-3 py-1.5 rounded-full hover:bg-orange-600 transition flex items-center gap-1.5 text-sm shadow-sm">
      <i data-lucide="shopping-cart" class="w-4 h-4"></i> My Cart
      <span id="cartBadge" class="cart-badge hidden">0</span>
    </button>
  </div>
  <div class="mb-6">
    <input id="searchInput" type="text" placeholder="Search supplies..."
      class="w-full max-w-md px-3 py-1.5 border border-orange-300 rounded-full text-sm focus:ring-2 focus:ring-orange-200 focus:outline-none"
      oninput="filterSupplies()" />
  </div>
  <div id="supplyGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5"></div>
</main>

<!-- Cart Overlay & Panel -->
<div id="cartOverlay" class="hidden fixed inset-0 z-10 opacity-0" onclick="toggleCart()"></div>
<aside id="cartPanel" class="fixed right-0 top-0 bottom-0 w-80 bg-white border-l border-gray-200 shadow-2xl flex flex-col transform translate-x-full z-20 text-sm">
  <div class="flex items-center justify-between px-5 py-3 border-b">
    <h3 class="text-base font-semibold flex items-center gap-2">
      <i data-lucide="shopping-cart" class="w-4 h-4 text-orange-600"></i> My Cart
    </h3>
    <button onclick="toggleCart()" class="text-gray-500 hover:text-gray-700"><i data-lucide="x" class="w-4 h-4"></i></button>
  </div>
  <ul id="cartItems" class="flex-1 overflow-y-auto px-5 py-3 space-y-2"></ul>
  <div class="p-3 border-t bg-white sticky bottom-0 left-0">
    <button onclick="openModal('confirmModal')" class="w-full bg-orange-500 text-white py-2 rounded-full hover:bg-orange-600 transition font-semibold text-sm shadow">Submit Requests</button>
  </div>
</aside>

<!-- Confirm Modal -->
<div id="confirmModal" class="fixed inset-0 hidden z-50 bg-black/50 flex items-center justify-center">
  <div class="bg-white rounded-xl p-6 w-80 flex flex-col gap-4 shadow-2xl">
    <h3 class="text-lg font-semibold text-gray-800 text-center">Confirm Submission</h3>
    <p class="text-sm text-gray-600 text-center">Are you sure you want to submit your cart?</p>
    <div class="flex justify-center gap-3 mt-2">
      <button onclick="closeModal('confirmModal')" class="px-4 py-1.5 rounded-lg bg-gray-200 hover:bg-gray-300 text-gray-700 transition">Cancel</button>
      <button onclick="submitCart()" class="px-4 py-1.5 rounded-lg bg-orange-500 hover:bg-orange-600 text-white shadow-md transition">Yes, Submit</button>
    </div>
  </div>
</div>

<!-- Single Request Modal -->
<div id="singleRequestModal" class="fixed inset-0 hidden z-50 bg-black/50 flex items-center justify-center">
  <div class="bg-white rounded-xl p-6 w-80 flex flex-col gap-4 shadow-2xl">
    <h3 class="text-lg font-semibold text-gray-800 text-center">Confirm Request</h3>
    <p id="singleRequestText" class="text-sm text-gray-600 text-center"></p>
    <div class="flex justify-center gap-3 mt-2">
      <button onclick="closeModal('singleRequestModal')" class="px-4 py-1.5 rounded-lg bg-gray-200 hover:bg-gray-300 text-gray-700 transition">Cancel</button>
      <button id="submitSingleRequestBtn" class="px-4 py-1.5 rounded-lg bg-green-500 hover:bg-green-600 text-white shadow-md transition">Submit Request</button>
    </div>
  </div>
</div>

<script>
lucide.createIcons();

// Supplies Data
const allSupplies = [
  { supply_id:'1', name:'Ink Printer', quantity_available:25, image:'assets/items/ink.jpg', variants:[{variant_name:'CYAN', quantity_available:12},{variant_name:'MAGENTA', quantity_available:5},{variant_name:'YELLOW', quantity_available:0}, {variant_name:'BLACK', quantity_available:8}] },
  { supply_id:'2', name:'Bond Paper', quantity_available:26, image:'assets/items/bondpaper.jpg', variants:[{variant_name:'A4', quantity_available:12},{variant_name:'Long', quantity_available:5},{variant_name:'Short', quantity_available:9}]},
  { supply_id:'3', name:'Envelope', quantity_available:17, image:'assets/items/envelope.png', variants:[{variant_name:'Long', quantity_available:12},{variant_name:'Short', quantity_available:5}]},
  { supply_id:'4', name:'Crayons', quantity_available:15, image:'assets/items/crayons.jpg', variants:[{variant_name:'12 Colors', quantity_available:10},{variant_name:'24 Colors', quantity_available:5}]},
  { supply_id:'5', name:'Marker', quantity_available:24, image:'assets/items/marker.jpg', variants:[{variant_name:'Black', quantity_available:10},{variant_name:'Blue', quantity_available:5},{variant_name:'Green', quantity_available:9}]},
  { supply_id:'6', name:'Folder', quantity_available:17, image:'assets/items/folder.jpg', variants:[{variant_name:'Long', quantity_available:12},{variant_name:'Short', quantity_available:5}]},
  { supply_id:'7', name:'Meter Stick', quantity_available:76, image:'assets/items/meterstick.png'},
  { supply_id:'8', name:'Eraser', quantity_available:15, image:'assets/items/eraser.jpg' },
];


let cart = {};
let pendingSingleRequest = null;

// Toast
function showToast(msg,type='info'){
  const container=document.getElementById('toastContainer');
  const colors={info:'bg-blue-500',success:'bg-green-500',error:'bg-red-500'};
  const icons={info:'info',success:'check-circle',error:'alert-circle'};
  const toast=document.createElement('div');
  toast.className=`flex items-center gap-3 px-6 py-3 text-white rounded-lg shadow-lg animate-slide-in ${colors[type]} text-base`;
  toast.innerHTML=`<i data-lucide="${icons[type]}" class="w-6 h-6"></i><span>${msg}</span>`;
  container.appendChild(toast);
  lucide.createIcons();
  setTimeout(()=>toast.remove(),3000);
}

// Modals
function openModal(id){document.getElementById(id).classList.remove('hidden');}
function closeModal(id){document.getElementById(id).classList.add('hidden');}

// Render Supplies
function renderSupplies(supplies){
  const grid=document.getElementById('supplyGrid'); grid.innerHTML='';
  if(!supplies.length){grid.innerHTML='<p class="text-gray-500 col-span-full text-center py-10">No results found</p>'; return;}
  supplies.forEach(s=>{
    let displayAvailability = s.variants?s.variants[0].quantity_available:s.quantity_available;
    const displayText=displayAvailability>0?displayAvailability:'Out of Stock';
    const isDisabled=displayAvailability===0;
    const variantOptions=s.variants?s.variants.map(v=>`<option value="${v.variant_name}" data-available="${v.quantity_available}">${v.variant_name}</option>`).join(''):'';
    const variantSelect=variantOptions?`<div class="mt-2"><label class="block text-xs font-medium text-gray-700 mb-1">Variant:</label><select id="variant-${s.supply_id}" onchange="updateVariantAvailability('${s.supply_id}')">${variantOptions}</select></div>`:'';
    const card=document.createElement('div');
    card.className="bg-white rounded-2xl shadow-sm border border-orange-500 hover:shadow-lg hover:-translate-y-1 transition-all duration-300 flex flex-col p-4 group";
    card.innerHTML=`
      <img src="${s.image}" alt="${s.name}" class="w-full h-44 object-cover rounded-lg mb-3">
      <div class="flex-1 flex flex-col justify-between">
        <div>
          <h3 class="text-sm font-semibold text-gray-800 group-hover:text-orange-600 transition">${s.name}</h3>
          <p class="text-xs text-gray-500 mt-1">Available: <span id="avail-${s.supply_id}" class="font-medium text-orange-600">${displayText}</span></p>
        </div>
        ${variantSelect}
      </div>
      <button onclick="addToCart('${s.supply_id}','${s.name}')" class="mt-4 bg-orange-500 hover:bg-orange-600 text-white text-xs font-semibold py-2 rounded-full flex items-center justify-center gap-1 transition active:scale-95">
        <i data-lucide="shopping-cart" class="w-4 h-4"></i> Add to Cart
      </button>
      <button onclick="prepareSingleRequest('${s.supply_id}','${s.name}')" class="mt-2 bg-green-500 hover:bg-green-600 text-white text-xs font-semibold py-2 rounded-full flex items-center justify-center gap-1 transition active:scale-95" ${isDisabled?'disabled opacity-50 cursor-not-allowed':''}>
        <i data-lucide="plus" class="w-4 h-4"></i> Request
      </button>
    `;
    grid.appendChild(card);
  });
  lucide.createIcons();
}

function updateVariantAvailability(id){
  const sel=document.getElementById(`variant-${id}`);
  if(!sel) return;
  const avail=parseInt(sel.selectedOptions[0].dataset.available)||0;
  document.getElementById(`avail-${id}`).textContent=avail>0?avail:'Out of Stock';
  const btn=sel.parentElement.parentElement.querySelector('button.bg-green-500');
  if(avail===0){btn.disabled=true; btn.classList.add('opacity-50','cursor-not-allowed');}
  else{btn.disabled=false; btn.classList.remove('opacity-50','cursor-not-allowed');}
}

function filterSupplies(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  renderSupplies(allSupplies.filter(s=>s.name.toLowerCase().includes(q)));
}

// CART FUNCTIONS
function renderCart(){
  const list=document.getElementById('cartItems'); list.innerHTML='';
  const entries=Object.values(cart);
  if(!entries.length){list.innerHTML='<p class="text-gray-500 text-center py-10">Your cart is empty 🛒</p>'; return;}
  entries.forEach(item=>{
    const li=document.createElement('li'); li.className="border-b pb-3 flex flex-col gap-3";
    li.innerHTML=`<div class="flex flex-col w-full gap-2">
      <span class="font-medium text-sm">${item.name}</span>
      ${item.variant!=='-'?`<div class="flex items-center gap-2"><label class="text-xs text-gray-500 w-16">Variant:</label><span class="text-xs text-gray-700 flex-1">${item.variant}</span></div>`:''}
      <div class="flex items-center gap-2">
        <label class="text-xs text-gray-500 w-16">Quantity:</label>
        <span class="text-xs text-gray-700">${item.quantity}</span>
        <button class="text-red-500 text-xs hover:underline remove-btn">Remove</button>
      </div>
    </div>`;
    li.querySelector('.remove-btn').addEventListener('click',()=>removeFromCart(item.supply_id,item.variant));
    list.appendChild(li);
  });
}

function updateBadge(){
  const badge=document.getElementById('cartBadge');
  const count=Object.keys(cart).length;
  if(count>0){badge.textContent=count; badge.classList.remove('hidden');}
  else badge.classList.add('hidden');
}

function addToCart(id,name){
  const sel=document.getElementById(`variant-${id}`);
  const variant=sel?sel.value:'-';
  const key=id+'__'+variant;
  if(cart[key]) return showToast(`${name}${variant!=='-'?' ('+variant+')':''} is already in your cart`,'error');
  const available=sel?parseInt(sel.selectedOptions[0].dataset.available):allSupplies.find(s=>s.supply_id===id).quantity_available;
  if(available===0) return showToast(`${name} is out of stock`,'error');
  cart[key]={supply_id:id,name,variant,quantity:1,available};
  renderCart(); updateBadge(); showToast(`${name}${variant!=='-'?' ('+variant+')':''} added to cart!`,'success');
}

function removeFromCart(id,variant='-'){ const key=id+'__'+variant; delete cart[key]; renderCart(); updateBadge(); showToast('Item removed','info'); }

function prepareSingleRequest(id,name){
  const sel=document.getElementById(`variant-${id}`);
  const variant=sel?sel.value:'-';
  const avail=sel?parseInt(sel.selectedOptions[0].dataset.available):allSupplies.find(s=>s.supply_id===id).quantity_available;
  if(avail===0) return showToast(`Cannot request "${name}" - Out of Stock`,'error');
  pendingSingleRequest={supply_id:id,name,variant,quantity:1};
  document.getElementById('singleRequestText').textContent=`Requesting 1 of ${name}${variant!=='-'?' ('+variant+')':''}?`;
  openModal('singleRequestModal');
}

document.getElementById('submitSingleRequestBtn').addEventListener('click',()=>{
  if(!pendingSingleRequest) return;
  showToast(`Requested ${pendingSingleRequest.name} successfully!`,'success');
  pendingSingleRequest=null;
  closeModal('singleRequestModal');
});

function toggleCart(){
  const panel=document.getElementById('cartPanel');
  const overlay=document.getElementById('cartOverlay');
  const isOpen=!panel.classList.contains('translate-x-full');
  if(isOpen){ panel.classList.add('translate-x-full'); overlay.classList.add('hidden','opacity-0');}
  else{ panel.classList.remove('translate-x-full'); overlay.classList.remove('hidden'); setTimeout(()=>overlay.classList.remove('opacity-0'),10);}
}

function submitCart(){
  if(!Object.keys(cart).length){ showToast('Your cart is empty!','error'); closeModal('confirmModal'); return; }
  showToast('Bulk request submitted successfully!','success');
  cart={}; renderCart(); updateBadge(); closeModal('confirmModal');
}

// Active Sidebar
const links={'teacher_dashboard.html':document.getElementById('link-dashboard'),'teacher_requests.html':document.getElementById('link-requests')};
const currentPage=window.location.pathname.split('/').pop();
if(links[currentPage]) links[currentPage].classList.add('nav-active'); else Object.values(links).forEach(l=>l.classList.add('nav-hover'));

// Fake request count loader for demo (replace with actual fetch)
let lastCount=0;
function loadRequestCount(){
  const badge=document.getElementById('notifBadge');
  const count=Math.floor(Math.random()*5); // demo random
  if(count>0){ badge.textContent=count; badge.classList.remove('hidden'); if(count!==lastCount){ badge.classList.add('bounce'); setTimeout(()=>badge.classList.remove('bounce'),500); } }
  else badge.classList.add('hidden');
  lastCount=count;
}
loadRequestCount();
setInterval(loadRequestCount,1500);

renderSupplies(allSupplies);
</script>
</body>
</html>
