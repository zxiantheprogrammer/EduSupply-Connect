<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <form action="login.php" method="POST" class="bg-white p-6 rounded shadow w-full max-w-sm space-y-4">
    <h2 class="text-xl font-semibold text-center text-blue-800">🔐 Login</h2>
    <input type="text" name="username" placeholder="Username" required class="w-full border px-3 py-2 rounded" />
    <input type="password" name="password" placeholder="Password" required class="w-full border px-3 py-2 rounded" />
    <button type="submit" class="w-full bg-blue-700 text-white py-2 rounded hover:bg-blue-800">Login</button>
  </form>
</body>
</html>
