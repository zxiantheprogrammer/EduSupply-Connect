<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="2;url=auth.html">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logging Out...</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Inter', sans-serif;
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, rgba(0,0,0,0.6), rgba(0,0,0,0.4)), url('assets/logo/danhs1.jpg') no-repeat center center fixed;
    background-size: cover;
  }

  .card {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
    border-radius: 1.5rem;
    padding: 2.5rem 3rem;
    text-align: center;
    color: #fff;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    animation: fadeIn 0.8s ease-in-out, pulse 2s infinite;
    max-width: 350px;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.9; }
    50% { transform: scale(1.05); opacity: 1; }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .spinner {
    width: 3rem;
    height: 3rem;
    border: 4px solid rgba(255,255,255,0.3);
    border-top: 4px solid #fff;
    border-radius: 50%;
    margin: 1.5rem auto 0;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .text-lg { font-size: 1.25rem; font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <div class="text-lg">Logging out...</div>
    <div class="mt-2">Redirecting to login page.</div>
    <div class="spinner"></div>
  </div>

  <script>
    setTimeout(() => {
      window.location.href = 'index.html';
    }, 2000);
  </script>
</body>
</html>
