<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Transactions</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Parkinsans:wght@300..800&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent: #f97316;
      --muted: #6b7280;
    }

    body,
    input,
    select,
    button,
    textarea,
    label {
      font-family: 'Parkinsans', sans-serif;
    }

    body {
      background-color: #fafafa;
      color: #1f2937;
      letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    main {
      margin-top: 80px;
    }

    th,
    td {
      font-size: 13px;
      text-align: center;
    }

    @media (min-width: 1024px) {
      main {
        margin-left: 16rem;
      }
    }

    @media (max-width: 1023px) {
      main {
        margin-left: 0;
      }
    }

    @keyframes pulse-slow {
      0%, 100% {
        opacity: 0.9;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.05);
      }
    }

    .animate-pulse-slow {
      animation: pulse-slow 3s ease-in-out infinite;
    }

    @keyframes bounce-once {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-4px);
      }
    }

    .bounce {
      animation: bounce-once 0.4s ease;
    }
  </style>
</head>

<header class="fixed w-full z-50 bg-gradient-to-r from-orange-500 via-orange-600 to-orange-700 shadow-lg backdrop-blur-md transition-all duration-300">
  <div class="max-w-7xl mx-auto px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="bg-white/20 p-2 rounded-full shadow-inner animate-pulse-slow">
        <i data-lucide="settings" class="w-6 h-6 text-white"></i>
      </div>
      <h1 class="text-lg font-semibold text-white tracking-wide">Admin Panel</h1>
    </div>
    <nav id="navLinks" class="flex items-center gap-6 text-sm font-medium"></nav>
  </div>
</header>

<body class="relative min-h-screen text-gray-700" style="background: url('assets/logo/danhs1.jpg') no-repeat center center fixed; background-size: cover;">
  <div class="absolute inset-0 bg-black/80 backdrop-blur-sm">

    <main class="flex-1 p-4 sm:p-6 max-w-7xl mx-auto">
      <!-- Header -->
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-6 gap-4">
        <div class="flex items-center gap-2">
          <i data-lucide="file-text" class="w-6 h-6" style="color:var(--accent)"></i>
          <h2 class="text-xl font-semibold text-white">Transactions History</h2>
        </div>

        <div class="flex items-center gap-3">
          <div class="relative">
            <i data-lucide="search" class="absolute left-3 top-2.5 w-4 h-4 text-gray-400"></i>
            <input id="searchInput" type="text" placeholder="Search by teacher name..."
              class="pl-9 pr-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-[--accent] w-56 sm:w-64 transition" />
          </div>

          <select id="statusFilter"
            class="border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-[--accent] px-3 py-2 transition">
            <option value="All">All Status</option>
            <option value="Approved">Approved</option>
            <option value="Rejected">Rejected</option>
          </select>
        </div>
      </div>

      <!-- Table Section -->
      <section class="bg-white rounded-2xl shadow border border-gray-100 overflow-hidden">
        <div class="hidden md:block overflow-x-auto">
          <table class="min-w-full text-sm">
            <thead class="bg-[--accent] text-white">
              <tr>
                <th class="p-3">Teacher</th>
                <th class="p-3">Item</th>
                <th class="p-3">Variant</th>
                <th class="p-3">Quantity</th>
                <th class="p-3">Date</th>
                <th class="p-3">Status</th>
              </tr>
            </thead>
            <tbody id="transactionTableBody" class="divide-y divide-gray-100 text-center"></tbody>
            <tr id="noResultsRow" class="hidden">
              <td colspan="6" class="py-6 text-gray-400 italic">No transactions found.</td>
            </tr>
          </table>
        </div>

        <!-- Mobile View -->
        <div id="mobileCards" class="md:hidden p-4 grid gap-4"></div>
        <p id="noResultsCard" class="hidden text-center py-8 text-gray-400 italic">No transactions found.</p>
      </section>
    </main>
  </div>

  <script>
    lucide.createIcons();

    // ---- NAV LINKS ----
const links = [
    { href: "admin_dashboard.html", label: "Supplies" },
    { href: "admin_teachers.html", label: "Teachers" },
    { href: "admin_requests.html", label: "Requests", badge: true },
    { href: "admin_transactions.html", label: "Transactions" }
];

const currentPage = window.location.pathname.split("/").pop();
const navContainer = document.getElementById('navLinks');

links.forEach(link => {
    const a = document.createElement('a');
    a.href = link.href;
    a.className = 'relative group flex items-center gap-1 text-orange-100 hover:text-white transition-colors duration-300';
    if(currentPage === link.href) a.classList.add('text-white', 'font-semibold');
    a.textContent = link.label;

    // Badge for requests
    if(link.badge) {
        const badge = document.createElement('span');
        badge.id = 'notifBadge';
        badge.className = 'hidden ml-1 bg-red-600 text-white text-xs font-bold rounded-full px-1.5 py-0.5 shadow-md';
        badge.textContent = '0';
        a.appendChild(badge);
    }

    const underline = document.createElement('span');
    underline.className = `absolute left-0 -bottom-1 w-full h-0.5 ${currentPage === link.href ? 'bg-white scale-x-100' : 'bg-white/60 scale-x-0 group-hover:scale-x-100'} transition-transform duration-300 origin-left`;
    a.appendChild(underline);

    navContainer.appendChild(a);
});

// Logout button
const logout = document.createElement('a');
logout.href = 'logout.html';
logout.className = 'ml-2 bg-white/20 hover:bg-red-500 text-white px-3 py-1.5 rounded-md transition-all duration-300 hover:shadow-lg hover:translate-y-[-2px]';
logout.textContent = 'Logout';
navContainer.appendChild(logout);

// ---- REQUEST BADGE FUNCTIONALITY ----
let lastCount = 0;

async function loadRequestCount() {
    try {
        const res = await fetch('requests/pending_count_admin.json'); // Replace with your API or JSON endpoint
        const data = await res.json();
        const badge = document.getElementById('notifBadge');
        const count = data.count || 0;

        if(count > 0) {
            badge.textContent = count;
            badge.classList.remove('hidden');
            if(count !== lastCount) {
                badge.classList.add('bounce');
                setTimeout(() => badge.classList.remove('bounce'), 500);
            }
        } else {
            badge.classList.add('hidden');
        }
        lastCount = count;
    } catch(err) {
        console.error('Failed to load request count:', err);
    }
}

// Load immediately and refresh every 15s
loadRequestCount();
setInterval(loadRequestCount, 15000);

    // ----- Sample Transaction Data -----
    let allTransactions = [
      { teacher_name: "John Doe", supply_name: "Pencils", variant_requested: "Red", quantity_requested: 5, request_date: "2025-10-29", status: "Approved" },
      { teacher_name: "Jane Smith", supply_name: "Notebooks", variant_requested: "Blue", quantity_requested: 10, request_date: "2025-10-28", status: "Rejected" },
      { teacher_name: "Mark Lee", supply_name: "Erasers", variant_requested: "White", quantity_requested: 3, request_date: "2025-10-27", status: "Approved" },
      { teacher_name: "Lisa Wong", supply_name: "Markers", variant_requested: "Assorted", quantity_requested: 2, request_date: "2025-10-26", status: "Rejected" },
      { teacher_name: "Tom Brown", supply_name: "Crayons", variant_requested: "Rainbow", quantity_requested: 1, request_date: "2025-10-25", status: "Approved" }
    ];

    const escapeHTML = str =>
      str ? String(str).replace(/[&<>"']/g, tag => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[tag])) : '';

    const statusBadge = status => {
      const base = "inline-block px-2 py-1 text-xs font-semibold rounded";
      switch (status) {
        case "Approved": return `<span class="${base} bg-green-100 text-green-800">Approved</span>`;
        case "Rejected": return `<span class="${base} bg-red-100 text-red-800">Rejected</span>`;
        default: return `<span class="${base} bg-gray-100 text-gray-800">${escapeHTML(status)}</span>`;
      }
    };

    function renderTransactions() {
      const tbody = document.getElementById('transactionTableBody');
      const mobileGrid = document.getElementById('mobileCards');
      const search = document.getElementById('searchInput').value.toLowerCase();
      const filter = document.getElementById('statusFilter').value;

      tbody.innerHTML = '';
      mobileGrid.innerHTML = '';

      const filtered = allTransactions.filter(r => {
        const matchesName = (r.teacher_name || '').toLowerCase().includes(search);
        const matchesStatus = filter === "All" || r.status === filter;
        return matchesName && matchesStatus;
      });

      const noRow = document.getElementById('noResultsRow');
      const noCard = document.getElementById('noResultsCard');

      if (filtered.length === 0) {
        noRow.classList.remove('hidden');
        noCard.classList.remove('hidden');
        return;
      }

      noRow.classList.add('hidden');
      noCard.classList.add('hidden');

      filtered.forEach(r => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="p-3">${escapeHTML(r.teacher_name)}</td>
          <td class="p-3">${escapeHTML(r.supply_name)}</td>
          <td class="p-3">${escapeHTML(r.variant_requested || '-')}</td>
          <td class="p-3">${escapeHTML(r.quantity_requested || '0')}</td>
          <td class="p-3">${escapeHTML(r.request_date)}</td>
          <td class="p-3">${statusBadge(r.status)}</td>
        `;
        tbody.appendChild(tr);

        const card = document.createElement('div');
        card.className = 'bg-white rounded-2xl shadow-sm border border-gray-100 p-4 flex flex-col gap-1';
        card.innerHTML = `
          <p class="text-sm font-medium text-gray-800">${escapeHTML(r.teacher_name)}</p>
          <p class="text-sm text-gray-700">${escapeHTML(r.supply_name)} (${escapeHTML(r.variant_requested || '-')})</p>
          <p class="text-xs text-gray-600">Quantity: ${escapeHTML(r.quantity_requested || '0')}</p>
          <p class="text-xs text-gray-600">Date: ${escapeHTML(r.request_date)}</p>
          <div class="mt-2">${statusBadge(r.status)}</div>
        `;
        mobileGrid.appendChild(card);
      });
    }

    document.getElementById('searchInput').addEventListener('input', renderTransactions);
    document.getElementById('statusFilter').addEventListener('change', renderTransactions);

    renderTransactions();
  </script>
</body>

</html>
